<script>

if( !/Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ) {

  document.getElementById('button').style.display = 'none';
  document.getElementById('text1').innerHTML = 'Download the Rail Planner app to see the full itinerary, map, statistics and more for this trip.';
}

if(window.location.host == 'eurailapp.com' || window.location.host == 'www.eurailapp.com' || window.location.host == 'share.eurailapp.com'){
    document.getElementById('button').setAttribute('href', "https://eurailapp.com"+path);
} else {

    document.getElementById('button').setAttribute('href', "https://acc.eurailapp.nl"+path);
}

date1 = new Date(fixDate(payload.travels[0].date));
date2 = new Date(fixDate(payload.travels[payload.travels.length -1].date));

payload.travels.forEach(value => {

    d = new Date(fixDate(value.date))

    if(d < date1){
        date1 = d;
    }

    if(d > date2){
        date2 = d;
    }
})

dateString = date1.getDate() + ' ' + date1.toLocaleString('en-UK', { month: 'long'}) + ' ' + date1.getFullYear() + ' - ' + date2.getDate() + ' ' + date2.toLocaleString('en-UK', { month: 'long'}) + ' ' + date2.getFullYear();

document.getElementById('date').innerHTML = dateString;

document.getElementById('brand').className = "logo-" + payload.brand;

var map;

function initMap() {
    
    map = new google.maps.Map(document.getElementById('map'), {
        center: {lat: -34.397, lng: 150.644},   
        zoom: 5,
        disableDefaultUI: true
    });
  
    var southWest = new google.maps.LatLng(35.586090337890596,-11.874847162109404);
    var northEast = new google.maps.LatLng(73.52990890877429,25.487756873977826);
    var bounds = new google.maps.LatLngBounds(southWest,northEast);
    map.setZoom(20)

    legs = [];

    parseLegs(map, payload.travels)
}

countries = [];
distance = 0;
trains = 0;

function parseLegs(map,travels){

    var southWest = {lat: 0, lng: 0};
    var northEast = {lat: 0, lng: 0};

    travels.forEach((travel,travelIndex) => {

      legs = travel.legs

      legs.sort((a,b) => {

        if(a.sortOrder < b.sortOrder){

            return -1;
        }

        return 1;
      });

      legs.forEach((leg, legIndex) => {
          
          trains++;

          info = JSON.parse(leg.infoJson)

          coordinates = []

          // //travel  = null
          
          // payload.travels.forEach(item => {

          //     if(item.id == leg.tripTravelId){
          //        // travel = item;
          //     }

          // })

          color = '#17204F'

          if(!payload.name || (travel && new Date(travel.date) > new Date()) || (travel && new Date(travel.date).toLocaleDateString() == new Date().toLocaleDateString())){

              color = '#0092be'
          }

          if(countries.indexOf(info.trainStopStations[0].country) == -1 && info.trainStopStations[0].country){
            countries.push(info.trainStopStations[0].country)
          }

          if(info.trainStopStations[info.trainStopStations.length - 1].country && countries.indexOf(info.trainStopStations[info.trainStopStations.length - 1].country) == -1){
            countries.push(info.trainStopStations[info.trainStopStations.length - 1].country)
          }

          info.trainStopStations.forEach((station,index) => {
              var latlng = {lat: station.coordinates.latitude, lng: station.coordinates.longitude};

              if(index < info.trainStopStations.length - 1){
              
                var nextStation = info.trainStopStations[index + 1];
                distance += greatCircle(station.coordinates,nextStation.coordinates) / 1000;
              }

              if(station.coordinates.latitude != 0 && station.coordinates.longitude != 0){
                coordinates.push(latlng)

                if((index == 0 && legIndex == 0) || (index == info.trainStopStations.length - 1 && legIndex == legs.length -1) || !payload.name && index == info.trainStopStations.length - 1){
                    var marker = new google.maps.Marker({
                        position: latlng,
                        map: map,
                        icon : {
                            path: google.maps.SymbolPath.CIRCLE,
                            scale: 6,
                            strokeColor: color,
                            strokeWeight: 2,
                            fillColor: color,
                            fillOpacity: 1
                        }
                    });
                }
              

                if(southWest.lat == 0 || southWest.lat > latlng.lat){southWest.lat = latlng.lat}
                if(northEast.lat == 0 || northEast.lat < latlng.lat){northEast.lat = latlng.lat}
                if(southWest.lng == 0 || southWest.lng > latlng.lng){southWest.lng = latlng.lng}
                if(northEast.lng == 0 || northEast.lng < latlng.lng){northEast.lng = latlng.lng}
              }
          })

          var lineSymbol = {
                path: 'M 0,0 0,0',
                strokeOpacity: 1,
                scale: 4
            };

            var path = new google.maps.Polyline({
                path: coordinates,
                strokeColor: color,
                strokeOpacity: 0,
                strokeWeight: 3,
                icons: [{
                    icon: lineSymbol,
                    offset: '0',
                    repeat: '7px'
                }],
            });


          let past = false;

          if(!payload.name){

              path.icons = null
              path.strokeOpacity = 1
          }

          path.setMap(map);
      });
    });

    var bounds = new google.maps.LatLngBounds(
        new google.maps.LatLng(southWest.lat,southWest.lng),
        new google.maps.LatLng(northEast.lat,northEast.lng)
    )

    map.fitBounds(bounds);

    document.getElementById('stats_countries_amount').innerHTML = countries.length;
    document.getElementById('stats_kilometstat_counter_bigers_amount').innerHTML = formatInt(Math.round(distance));
    document.getElementById('stats_trains_amount').innerHTML = trains;

    if(payload.name){
      document.getElementById('title').innerHTML = payload.name;
    } else {
      document.getElementById('title').innerHTML = payload.travels[0].from + " - "  + payload.travels[0].to
      leg1 = JSON.parse(legs[0].infoJson).startTime
      leg2 = JSON.parse(legs[legs.length - 1].infoJson).endTime
      date = new Date(fixDate(payload.travels[0].date))
      dateString = date.getDate() + ' ' + date.toLocaleString('en-UK', { month: 'long'}) + ' ' + date.getFullYear();
      
      dateString = dateString + " " + padInt(leg1.hours) + ':' + padInt(leg1.minutes) + " - " + padInt(leg2.hours) + ':' + padInt(leg2.minutes)
      document.getElementById('date').innerHTML = dateString;
    } 

    function padInt(value){

value = '' + value


if(value.length == 1){
  return '0' + value;
}

return value;
}

    function formatInt(value){

      value = Math.round(value);      
      return(value)
    }

    function greatCircle(start,end){

      lat1 = start.latitude;
      lat2 = end.latitude;

      lon1 = start.longitude;
      lon2 = end.longitude;

      var R = 6371e3; // metres
      var φ1 = lat1.toRadians();
      var φ2 = lat2.toRadians();
      var Δφ = (lat2-lat1).toRadians();
      var Δλ = (lon2-lon1).toRadians();

      var a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
              Math.cos(φ1) * Math.cos(φ2) *
              Math.sin(Δλ/2) * Math.sin(Δλ/2);
      var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

      var d = R * c;

      return d;

    }

}

function fixDate(date){

  return date.split('+')[0];
}
